<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Path Slash Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Path Slash Converter</h1>
      <p>パス内の / と \ を変換するツール</p>
    </header>

    <section class="editor">
      <div class="panel">
        <label for="input">入力</label>
        <textarea
          id="input"
          placeholder="例: C:\Users\YourName\Documents\project\file.txt"
        ></textarea>
      </div>

      <div class="actions">
        <button type="button" id="toBackslash">/ → \</button>
        <button type="button" id="toDoubleBackslash">/ → \\</button>
        <button type="button" id="toSlash">\ → /</button>
        <button type="button" id="copyOutput" class="secondary">Copy</button>
        <button type="button" id="clearAll" class="secondary">Clear</button>
      </div>

      <div class="panel">
        <label for="output">出力</label>
        <textarea
          id="output"
          readonly
          placeholder="変換結果がここに表示されます"
        ></textarea>
        <div class="status" id="status"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
