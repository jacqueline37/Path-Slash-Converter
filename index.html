<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Path Slash Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <div>
          <h1 id="title">Path Slash Converter</h1>
          <p id="description">パス内の / と \（¥ / ￥ / ＼）を相互変換するツール</p>
        </div>

        <div class="lang-switch" role="group" aria-label="Language switch">
          <button type="button" id="langJa" class="secondary">日本語</button>
          <button type="button" id="langEn" class="secondary">English</button>
        </div>
      </div>
    </header>

    <section class="editor">
      <div class="panel">
        <label for="input" id="inputLabel">入力</label>
        <textarea
          id="input"
          placeholder="例: C:\Users\YourName\Documents\project\file.txt"
        ></textarea>
      </div>

      <div class="actions">
        <button type="button" id="swapSlash">/ ⇄ \ (¥)</button>
        <button type="button" id="copyOutput" class="secondary">Copy</button>
        <button type="button" id="clearAll" class="secondary">Clear</button>
      </div>

      <div class="panel">
        <label for="output" id="outputLabel">出力</label>
        <textarea
          id="output"
          readonly
          placeholder="変換結果がここに表示されます"
        ></textarea>
        <div class="status" id="status"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
