<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead-text">
        <h1 id="title">Path Slash Converter</h1>
        <p id="description">パス内の <span class="sep">/</span> と <span class="sep">\</span> を、どちらか一方に揃えます。¥・￥・＼ も <span class="sep">\</span> として扱います。</p>
      </div>
      <div class="lang" role="group" id="langGroup" aria-label="表示言語">
        <button type="button" id="langJa" lang="ja" aria-pressed="true">日本語</button>
        <button type="button" id="langEn" lang="en" aria-pressed="false">English</button>
      </div>
    </header>

    <main class="sheet">
      <div class="field">
        <div class="field-head">
          <label id="inputLabel" for="input">変換したいパス</label>
          <button type="button" id="clearAll" class="text-button">クリア</button>
        </div>
        <textarea
          id="input"
          class="path-box"
          rows="3"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          placeholder="C:\Users\Name\Documents\file.txt"></textarea>
      </div>

      <fieldset class="direction">
        <legend id="directionLabel">揃える区切り文字</legend>
        <div class="direction-options">
          <label class="option">
            <input type="radio" name="target" value="/" checked />
            <span class="glyph" aria-hidden="true">/</span>
            <span class="option-text" id="slashText">スラッシュ</span>
          </label>
          <label class="option">
            <input type="radio" name="target" value="\" />
            <span class="glyph" aria-hidden="true">\</span>
            <span class="option-text" id="backslashText">バックスラッシュ（¥）</span>
          </label>
        </div>
      </fieldset>

      <div class="field">
        <div class="field-head">
          <label id="outputLabel" for="output">変換結果</label>
        </div>
        <output id="output" for="input" class="path-box result" data-empty="ここに変換結果が表示されます"></output>
        <div class="result-foot">
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <button type="button" id="copyOutput" class="primary">結果をコピー</button>
        </div>
      </div>
    </main>

    <footer class="note">
      <p id="privacyNote">入力したパスはこのページの中だけで変換され、どこにも送信されません。https:// などの URL はそのまま残します。</p>
    </footer>
  </div>
