<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Path Slash Converter</title>
  <meta name="description" content="パス内の / と \（¥ / ￥ / ＼）を相互変換できる無料のブラウザツール。インストール不要、コピー1クリックで完了。" />
  <meta property="og:title" content="Path Slash Converter" />
  <meta property="og:description" content="パス内の / と \（¥ / ￥ / ＼）を相互変換できる無料のブラウザツール。インストール不要、コピー1クリックで完了。" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="style.css" />
</head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JZM8ZQH42C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-JZM8ZQH42C');

<body>

<main class="app">
<header class="header">
<div class="header-top">
<div>
<h1 id="title">Path Slash Converter</h1>
<p id="description">
パス内の / と \（¥ / ￥ / ＼）を相互変換するツール</p>
</div>

<div class="lang-switch">
<button id="langJa" class="secondary">日本語</button>
<button id="langEn" class="secondary">English</button>
</div>
</div>
</header>

<section class="editor">
<div class="panel">
<label id="inputLabel" for="input">入力</label>
<textarea
id="input"
placeholder="C:\Users\Name\Documents\file.txt"></textarea>
</div>

<div class="actions">
<button id="swapSlash">/ ⇄ \ (¥)</button>
<button id="copyOutput" class="secondary">
Copy
</button>
<button id="clearAll" class="secondary">
Clear
</button>
</div>

<div class="panel">
<label id="outputLabel" for="output">出力</label>
<textarea id="output" readonly placeholder="変換結果"></textarea>
<div class="status" id="status"></div>
</div>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
